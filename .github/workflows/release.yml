name: Signed Android release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TELLYO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TELLYO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TELLYO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TELLYO_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TELLYO_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tellyo-release.jks"

      - name: Build signed APK and app bundle
        shell: bash
        env:
          TELLYO_KEYSTORE_PATH: ${{ runner.temp }}/tellyo-release.jks
          TELLYO_KEYSTORE_PASSWORD: ${{ secrets.TELLYO_KEYSTORE_PASSWORD }}
          TELLYO_KEY_ALIAS: ${{ secrets.TELLYO_KEY_ALIAS }}
          TELLYO_KEY_PASSWORD: ${{ secrets.TELLYO_KEY_PASSWORD }}
          TELLYO_CONFIG_BASE_URL: ${{ vars.TELLYO_CONFIG_BASE_URL }}
        run: bash ./gradlew testReleaseUnitTest lintRelease assembleRelease bundleRelease --no-daemon

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tellyo-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 30
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
